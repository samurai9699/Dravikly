<!DOCTYPE html>
<html>

<head>
  <title>Generate Dravikly Favicon</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background: #1a1f2e;
      color: white;
    }

    canvas {
      border: 1px solid #333;
      margin: 10px;
      border-radius: 8px;
    }

    button {
      background: linear-gradient(135deg, #06b6d4, #60a5fa);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      margin: 5px;
      font-weight: 600;
    }

    button:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .preview {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin: 20px 0;
    }

    .preview-item {
      text-align: center;
      background: #252b3d;
      padding: 20px;
      border-radius: 12px;
    }
  </style>
</head>

<body>
  <h1>🎨 Dravikly Favicon Generator</h1>
  <p>Click the buttons below to download each favicon size:</p>

  <div class="preview">
    <div class="preview-item">
      <canvas id="canvas16" width="16" height="16"></canvas>
      <br><button onclick="download('canvas16', 'favicon-16x16.png')">Download 16x16</button>
    </div>
    <div class="preview-item">
      <canvas id="canvas32" width="32" height="32"></canvas>
      <br><button onclick="download('canvas32', 'favicon-32x32.png')">Download 32x32</button>
      <br><button onclick="download('canvas32', 'favicon.ico')">Download ICO</button>
    </div>
    <div class="preview-item">
      <canvas id="canvas180" width="180" height="180"></canvas>
      <br><button onclick="download('canvas180', 'apple-touch-icon.png')">Download 180x180 (Apple)</button>
    </div>
    <div class="preview-item">
      <canvas id="canvas192" width="192" height="192"></canvas>
      <br><button onclick="download('canvas192', 'android-chrome-192x192.png')">Download 192x192 (Android)</button>
    </div>
    <div class="preview-item">
      <canvas id="canvas512" width="512" height="512"></canvas>
      <br><button onclick="download('canvas512', 'android-chrome-512x512.png')">Download 512x512 (Android)</button>
    </div>
  </div>

  <script>
    function drawLogo(canvas) {
      const ctx = canvas.getContext('2d');
      const size = canvas.width;
      const scale = size / 100;
      const radius = 20 * scale;

      ctx.clearRect(0, 0, size, size);

      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#06b6d4');
      gradient.addColorStop(1, '#60a5fa');

      ctx.fillStyle = '#1a1f2e';
      ctx.beginPath();
      ctx.moveTo(radius, 0);
      ctx.lineTo(size - radius, 0);
      ctx.quadraticCurveTo(size, 0, size, radius);
      ctx.lineTo(size, size - radius);
      ctx.quadraticCurveTo(size, size, size - radius, size);
      ctx.lineTo(radius, size);
      ctx.quadraticCurveTo(0, size, 0, size - radius);
      ctx.lineTo(0, radius);
      ctx.quadraticCurveTo(0, 0, radius, 0);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = gradient;
      ctx.globalAlpha = 0.3;
      ctx.lineWidth = 3 * scale;
      ctx.beginPath();
      ctx.arc(50 * scale, 50 * scale, 38 * scale, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;

      ctx.strokeStyle = gradient;
      ctx.lineWidth = 4 * scale;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(30 * scale, 50 * scale);
      ctx.quadraticCurveTo(40 * scale, 30 * scale, 50 * scale, 50 * scale);
      ctx.quadraticCurveTo(60 * scale, 70 * scale, 70 * scale, 50 * scale);
      ctx.stroke();

      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(30 * scale, 50 * scale, 4.5 * scale, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(50 * scale, 50 * scale, 4.5 * scale, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(70 * scale, 50 * scale, 4.5 * scale, 0, Math.PI * 2);
      ctx.fill();

      ctx.globalAlpha = 0.85;
      ctx.strokeStyle = gradient;
      ctx.lineWidth = 3.5 * scale;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(50 * scale, 68 * scale);
      ctx.lineTo(50 * scale, 42 * scale);
      ctx.moveTo(42 * scale, 50 * scale);
      ctx.lineTo(50 * scale, 42 * scale);
      ctx.lineTo(58 * scale, 50 * scale);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    function download(canvasId, filename) {
      const canvas = document.getElementById(canvasId);
      const link = document.createElement('a');
      link.download = filename;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    window.onload = function () {
      ['canvas16', 'canvas32', 'canvas180', 'canvas192', 'canvas512'].forEach(id => {
        drawLogo(document.getElementById(id));
      });
    };
  </script>
</body>

</html>
